
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SewBridge - Connect with Master Tailors</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --dark: #1a1a1a;
      --green: #1D9E75;
      --bg: #faf9f7;
      --white: #fff;
      --gray: #666;
      --lightgray: #f0f0f0;
      --danger: #e74c3c;
      --warning: #f39c12;
      --success: #27ae60;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      background-color: var(--bg);
      line-height: 1.6;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
    }

    /* ===== LANDING PAGE ===== */
    .landing-container {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(26,26,26,0.95) 0%, rgba(29,158,117,0.2) 100%);
    }

    .auth-box {
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      padding: 3rem 2rem;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 0.5rem;
    }

    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--lightgray);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 600;
      color: var(--gray);
      transition: all 0.3s;
    }

    .auth-tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--dark);
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--lightgray);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.1);
    }

    .role-toggle {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .role-btn {
      flex: 1;
      padding: 0.75rem;
      border: 2px solid var(--lightgray);
      background: var(--white);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      color: var(--dark);
    }

    .role-btn.active {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    .tailor-type-group { display: none; }
    .tailor-type-group.active { display: block; }

    .tailor-type-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tailor-type-card {
      padding: 1rem;
      border: 2px solid var(--lightgray);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
    }

    .tailor-type-card:hover {
      border-color: var(--green);
      background: rgba(29,158,117,0.05);
    }

    .tailor-type-card.selected {
      border-color: var(--green);
      background: rgba(29,158,117,0.1);
    }

    .tailor-type-card h4 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .tailor-type-card p {
      font-size: 0.8rem;
      color: var(--gray);
    }

    .form-group.hidden { display: none; }

    .auth-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .auth-btn:hover {
      background: #16a373;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(29,158,117,0.3);
    }

    .error-message {
      background: #fdecea;
      color: #c0392b;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      border: 1px solid #f5c6cb;
      display: none;
    }

    .error-message.show { display: block; }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      border: 1px solid #c3e6cb;
      display: none;
    }

    .success-message.show { display: block; }

    /* ===== MAIN APP ===== */
    .main-app {
      display: none;
      height: 100vh;
    }

    .main-app.authenticated {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: var(--white);
      border-right: 1px solid var(--lightgray);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--lightgray);
      text-align: center;
    }

    .sidebar-logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 0.5rem;
    }

    .sidebar-user {
      font-size: 0.85rem;
      color: var(--gray);
    }

    .sidebar-menu {
      flex: 1;
      padding: 1rem 0;
    }

    .sidebar-item {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      color: var(--gray);
      border-left: 3px solid transparent;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
    }

    .sidebar-item:hover {
      background: var(--lightgray);
      color: var(--dark);
    }

    .sidebar-item.active {
      background: rgba(29,158,117,0.1);
      color: var(--green);
      border-left-color: var(--green);
    }

    .sidebar-item i {
      width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--lightgray);
    }

    .logout-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--lightgray);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: var(--dark);
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: var(--danger);
      color: var(--white);
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      margin-left: 250px;
      background: var(--bg);
      overflow-y: auto;
      height: 100vh;
    }

    .content-header {
      background: var(--white);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--lightgray);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content-header h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--green);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .content-area {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* DASHBOARD SECTIONS */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--white);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--lightgray);
      padding-bottom: 1rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--dark);
    }

    .card-icon {
      font-size: 1.5rem;
      color: var(--green);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--gray);
    }

    .empty-state-icon {
      font-size: 2rem;
      color: var(--lightgray);
      margin-bottom: 1rem;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item {
      padding: 1rem;
      background: var(--lightgray);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-title {
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.25rem;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--gray);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-pending {
      background: #fff3cd;
      color: #856404;
    }

    .badge-active {
      background: #d1ecf1;
      color: #0c5460;
    }

    .badge-completed {
      background: #d4edda;
      color: #155724;
    }

    /* QUICK ACTIONS */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }

    .action-btn {
      padding: 1rem;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      text-align: center;
    }

    .action-btn:hover {
      background: #16a373;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(29,158,117,0.3);
    }

    /* PROFILE SECTIONS */
    .profile-section {
      background: var(--white);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .profile-section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--lightgray);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group-inline {
      display: flex;
      flex-direction: column;
    }

    .form-group-inline label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--dark);
      font-size: 0.9rem;
    }

    .form-group-inline input,
    .form-group-inline textarea,
    .form-group-inline select {
      padding: 0.75rem;
      border: 1px solid var(--lightgray);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.3s;
    }

    .form-group-inline input:focus,
    .form-group-inline textarea:focus,
    .form-group-inline select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.1);
    }

    .form-group-inline textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .save-btn, .delete-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .save-btn {
      background: var(--green);
      color: var(--white);
    }

    .save-btn:hover {
      background: #16a373;
    }

    .delete-btn {
      background: var(--lightgray);
      color: var(--danger);
    }

    .delete-btn:hover {
      background: var(--danger);
      color: var(--white);
    }

    /* IMAGE UPLOAD */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .portfolio-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed var(--lightgray);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--bg);
    }

    .portfolio-item:hover {
      border-color: var(--green);
      background: rgba(29,158,117,0.05);
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-placeholder {
      text-align: center;
      color: var(--gray);
    }

    .upload-placeholder i {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .file-input {
      display: none;
    }

    /* MEASUREMENTS LIST */
    .measurement-item {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background: var(--lightgray);
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .measurement-label {
      font-weight: 600;
      color: var(--dark);
    }

    .measurement-value {
      color: var(--green);
      font-weight: 600;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
      }

      .main-content {
        margin-left: 200px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .tailor-type-options {
        grid-template-columns: 1fr;
      }

      .content-header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        width: 180px;
      }

      .main-content {
        margin-left: 180px;
      }

      .content-area {
        padding: 1rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<!-- ===== LANDING PAGE ===== -->
<div class="landing-container" id="landingPage">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">SewBridge</div>
      <p style="color: var(--gray); font-size: 0.95rem;">Connect with Master Tailors</p>
    </div>

    <div class="error-message" id="errorMsg"></div>
    <div class="success-message" id="successMsg"></div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" onclick="switchAuthTab('signin')">Sign In</button>
      <button class="auth-tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>

    <!-- SIGN IN -->
    <form class="auth-form active" id="signinForm" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signinEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signinPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <!-- SIGN UP -->
    <form class="auth-form" id="signupForm" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label>I want to sign up as:</label>
        <div class="role-toggle">
          <button type="button" class="role-btn active" onclick="selectRole('customer')">
            <i class="fas fa-user"></i> Customer
          </button>
          <button type="button" class="role-btn" onclick="selectRole('tailor')">
            <i class="fas fa-scissors"></i> Tailor
          </button>
        </div>
      </div>

      <div class="tailor-type-group" id="tailorTypeGroup">
        <label style="display: block; font-weight: 600; margin-bottom: 1rem;">Account Type:</label>
        <div class="tailor-type-options">
          <div class="tailor-type-card" onclick="selectTailorType('individual')">
            <i class="fas fa-user-tie" style="font-size: 1.5rem; color: var(--green); margin-bottom: 0.5rem;"></i>
            <h4>Individual</h4>
            <p>Self-employed tailor</p>
          </div>
          <div class="tailor-type-card" onclick="selectTailorType('company')">
            <i class="fas fa-building" style="font-size: 1.5rem; color: var(--green); margin-bottom: 0.5rem;"></i>
            <h4>Company</h4>
            <p>Tailoring business</p>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="signupFirstName" placeholder="Your first name" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="signupLastName" placeholder="Your last name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required>
      </div>

      <div class="form-group hidden" id="companyNameGroup">
        <label>Company Name</label>
        <input type="text" id="companyName" placeholder="Your business name">
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" id="signupLocation" placeholder="City, State" required>
      </div>

      <button type="submit" class="auth-btn">Create Account</button>
    </form>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="main-app" id="mainApp">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">SewBridge</div>
      <div class="sidebar-user" id="sidebarUserName">User</div>
    </div>

    <div class="sidebar-menu" id="sidebarMenu">
      <!-- Menu items inserted here based on role -->
    </div>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Sign Out
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="content-header">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="user-avatar" id="userAvatar">JD</div>
    </div>

    <div class="content-area" id="contentArea">
      <!-- Content inserted here -->
    </div>
  </div>
</div>

<script>
// ===== STATE MANAGEMENT =====
let currentUser = null;
let selectedRole = 'customer';
let selectedTailorType = 'individual';
let currentPage = 'dashboard';

const BUILTIN_ACCOUNTS = {
  'ignitedtrans@gmail.com': { pwd: 'password123', name: 'Ignited Trans', role: 'customer' },
  'gracekip9@gmail.com': { pwd: 'SewBridge#Tailor26', name: 'Grace Kipchoge', role: 'tailor' },
  'ministry.servant9@gmail.com': { pwd: 'SewBridge#Customer26', name: 'Ministry Servant', role: 'customer' }
};

// ===== AUTH FUNCTIONS =====
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
  document.getElementById(tab === 'signin' ? 'signinForm' : 'signupForm').classList.add('active');
  clearMessages();
}

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
  event.target.closest('.role-btn').classList.add('active');
  const tailorGroup = document.getElementById('tailorTypeGroup');
  if(role === 'tailor') {
    tailorGroup.classList.add('active');
  } else {
    tailorGroup.classList.remove('active');
  }
}

function selectTailorType(type) {
  selectedTailorType = type;
  document.querySelectorAll('.tailor-type-card').forEach(card => card.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  const companyGroup = document.getElementById('companyNameGroup');
  if(type === 'company') {
    companyGroup.classList.remove('hidden');
    document.getElementById('companyName').required = true;
  } else {
    companyGroup.classList.add('hidden');
    document.getElementById('companyName').required = false;
  }
}

function handleSignIn(event) {
  event.preventDefault();
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;

  if(BUILTIN_ACCOUNTS[email] && BUILTIN_ACCOUNTS[email].pwd === password) {
    const account = BUILTIN_ACCOUNTS[email];
    currentUser = {
      email: email,
      name: account.name,
      role: account.role,
      location: 'United States'
    };
    localStorage.setItem('sewbridgeUser', JSON.stringify(currentUser));
    showApp();
    return;
  }

  showError('Invalid email or password. Try: ignitedtrans@gmail.com / password123');
}

function handleSignUp(event) {
  event.preventDefault();
  const firstName = document.getElementById('signupFirstName').value.trim();
  const lastName = document.getElementById('signupLastName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const location = document.getElementById('signupLocation').value.trim();

  if(!firstName || !lastName || !email || !password || !location) {
    showError('Please fill in all required fields.');
    return;
  }

  if(password.length < 6) {
    showError('Password must be at least 6 characters.');
    return;
  }

  currentUser = {
    email: email,
    name: firstName + ' ' + lastName,
    role: selectedRole,
    location: location,
    tailorType: selectedRole === 'tailor' ? selectedTailorType : null,
    companyName: selectedRole === 'tailor' && selectedTailorType === 'company' ? document.getElementById('companyName').value : null
  };

  localStorage.setItem('sewbridgeUser', JSON.stringify(currentUser));
  showSuccess('Account created successfully! Welcome to SewBridge.');

  setTimeout(() => {
    showApp();
  }, 1500);
}

function showApp() {
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('mainApp').classList.add('authenticated');
  updateUI();
  renderSidebar();
  showPage('dashboard');
}

function updateUI() {
  const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('sidebarUserName').textContent = currentUser.name;
}

function handleLogout() {
  if(confirm('Sign out?')) {
    currentUser = null;
    localStorage.removeItem('sewbridgeUser');
    document.getElementById('mainApp').classList.remove('authenticated');
    document.getElementById('landingPage').style.display = 'flex';
    document.getElementById('signinForm').reset();
    document.getElementById('signupForm').reset();
  }
}

// ===== PAGE RENDERING =====
function showPage(page) {
  currentPage = page;
  const contentArea = document.getElementById('contentArea');

  // Update sidebar active state
  document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
  event?.currentTarget?.classList.add('active');

  if(page === 'dashboard') {
    renderDashboard();
  } else if(page === 'profile') {
    renderProfile();
  } else if(page === 'settings') {
    renderSettings();
  } else if(page === 'measurement-studio') {
    studioStep = 1;
    renderMeasurementStudio();
  } else if(page === 'customer-profiles') {
    renderCustomerProfiles();
  } else {
    contentArea.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-construction"></i></div><p>Coming soon...</p></div>`;
  }

  document.getElementById('pageTitle').textContent = {
    dashboard: 'Dashboard',
    profile: 'Profile',
    settings: 'Settings',
    'measurement-studio': 'Measurement Studio',
    'customer-profiles': 'Customer Profiles',
    orders: 'Active Orders',
    messages: 'Messages',
    requests: 'New Requests',
    jobs: 'Active Jobs',
    calendar: 'Calendar',
    earnings: 'Earnings',
    approvals: 'Pending Approvals',
    issues: 'Issues'
  }[page] || 'Page';
}

function formatMeasurement(value, unit = studioData.unit) {
  if(unit === 'inches') {
    const quarters = Math.round(value * 4) / 4;
    const whole = Math.floor(quarters);
    const fraction = (quarters - whole) * 4;
    const fractionMap = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' };
    const fractionStr = fractionMap[fraction] || '';
    return whole + (fractionStr ? ' ' + fractionStr : '') + '"';
  } else {
    return (Math.round(value * 2) / 2) + ' cm';
  }
}

  if(field === 'seamAllowance') {
    studioData[field] = value;
  } else if(['age', 'height', 'weight', 'chest', 'waist', 'hips', 'shoulder', 'neckCirc', 'sleeve', 'inseam'].includes(field)) {
    studioData[field] = parseFloat(value) || 0;
  } else {
    studioData[field] = value;
  }
}

function advanceStudioStep(step) {
  // Step 1 → Step 2: Validate customer info
  if(step === 2 && !studioData.customerName) {
    alert('Please enter customer name');
    return;
  }

  // Step 3 → Step 4: Validate body measurements and garment requirements
  if(step === 4) {
    // Tops validation
    if(studioData.garmentType !== 'pants') {
      if(studioData.chest <= 0 || studioData.shoulder <= 0 || studioData.neckCirc <= 0 || studioData.sleeve <= 0 || studioData.waist <= 0 || studioData.hips <= 0) {
        alert('Please fill in all required top measurements:\n• Chest\n• Shoulder\n• Neck Circumference\n• Sleeve Length\n• Waist\n• Hips');
        return;
      }

      // Long sleeve additional validation
      if(studioData.sleeveType === 'long') {
        if(studioData.bicepCirc <= 0 || studioData.bicepLength <= 0 || studioData.elbowCirc <= 0 || studioData.elbowLength <= 0 || studioData.wristCirc <= 0 || studioData.wristLength <= 0) {
          alert('Please fill in all sleeve measurements:\n• Bicep Circumference & Length\n• Elbow Circumference & Length\n• Wrist Circumference & Length');
          return;
        }
      }
    }

    // Pants validation
    if(studioData.garmentType === 'pants') {
      if(studioData.waist <= 0 || studioData.hips <= 0 || studioData.inseam <= 0) {
        alert('Please fill in all required pants measurements (Waist, Hips, Inseam)');
        return;
      }
    }

    // Both validation
    if(studioData.garmentType === 'both') {
      if(studioData.chest <= 0 || studioData.shoulder <= 0 || studioData.neckCirc <= 0 || studioData.sleeve <= 0 || studioData.waist <= 0 || studioData.hips <= 0) {
        alert('Please fill in all required top measurements:\n• Chest\n• Shoulder\n• Neck Circumference\n• Sleeve Length\n• Waist\n• Hips');
        return;
      }
      if(studioData.inseam <= 0) {
        alert('Please fill in all required pants measurements (Inseam)');
        return;
      }
      if(studioData.sleeveType === 'long') {
        if(studioData.bicepCirc <= 0 || studioData.bicepLength <= 0 || studioData.elbowCirc <= 0 || studioData.elbowLength <= 0 || studioData.wristCirc <= 0 || studioData.wristLength <= 0) {
          alert('Please fill in all sleeve measurements:\n• Bicep Circumference & Length\n• Elbow Circumference & Length\n• Wrist Circumference & Length');
          return;
        }
      }
    }
  }

  studioStep = step;
  renderMeasurementStudio();
}

function calculateAllMeasurements() {
  // CRITICAL: Ensure fitStyle is set with safety fallback
  const fitStyle = studioData.fitStyle || 'regular';
  const easeConfig = EASE_ALLOWANCES[fitStyle];

  if(!easeConfig) {
    console.error(`ERROR: easeConfig not found for fitStyle: ${fitStyle}`);
    console.error('Available ease configs:', Object.keys(EASE_ALLOWANCES));
    return {};
  }

  const seam = studioData.seamAllowance ? SEAM_ALLOWANCE : 0;

  // Professional tailoring calculations based on user's table
  const armCircumference = studioData.chest * 0.4; // Estimate from chest
  const baseCapHeight = (studioData.chest / 4 + studioData.shoulder) / 2.5;
  const baseNeckWidth = studioData.neckCirc / 5;
  const baseNeckDepth = studioData.neckCirc / 5;
  const baseBackNeckDepth = studioData.neckCirc / 6;

  // ARM MEASUREMENTS BASE VALUES (derived from chest)
  const baseBicep = studioData.chest * 0.28;
  const baseElbow = studioData.chest * 0.22;
  const baseWrist = studioData.chest * 0.18;
  const baseCuff = studioData.chest * 0.15;

  // Calculate basic measurements with ease and seam
  const chestFinal = studioData.chest + easeConfig.chest + seam;
  const shoulderFinal = studioData.shoulder + easeConfig.shoulder + seam;

  // DERIVED MEASUREMENTS FOR PATTERN DRAFTING
  const chestQuarter = chestFinal / 4;
  const shoulderHalf = shoulderFinal / 2;

  // NECK MEASUREMENTS - Calculate front first, then derive back from front
  const frontNeckDepthCalc = baseNeckDepth + easeConfig.neckDepth + seam;
  const frontNeckWidthCalc = baseNeckWidth + easeConfig.neckWidth + seam;
  // Back Neck Depth = Front Neck Depth / 3, minimum 1.5" for adults, plus 0.5" allowance
  const backNeckDepthCalc = Math.max((frontNeckDepthCalc / 3), 1.5) + 0.5;

  // Cap Height - Auto-adjust to 4.5-5" range if calculated value is unsuitable
  let capHeightCalculated = baseCapHeight + easeConfig.capHeight + seam;
  const capHeightFinal = (capHeightCalculated < 4.5 || capHeightCalculated > 5)
    ? 4.75  // Auto-adjust to ideal 4.75" (middle of 4.5-5" range)
    : capHeightCalculated;

  // SLEEVE LENGTH - Add 1" allowance if sleeve is 11"
  let sleeveLengthCalc = studioData.sleeveType === 'short'
    ? (studioData.sleeve * 0.5) + easeConfig.shoulder + seam
    : studioData.sleeve + easeConfig.shoulder + seam;

  const sleeveLengthFinal = (Math.abs(sleeveLengthCalc - 11) < 0.1)
    ? sleeveLengthCalc + 1
    : sleeveLengthCalc;

  // T-SHIRT FULL LENGTH - Add 1" for ease and sewing allowance
  const fullLengthFinal = studioData.tshirtLength ? parseFloat(studioData.tshirtLength) + 1 : 0;

  return {
    // PROFESSIONAL FITTED MEASUREMENTS (Ready for Pattern Drafting)

    // BASIC MEASUREMENTS - Fit-based ease + seam
    chest: chestFinal,
    chestQuarter: chestQuarter,  // Used in sleeve and neckline calculations
    shoulder: shoulderFinal,
    shoulderHalf: shoulderHalf,  // Used in armhole and sleeve cap calculations

    // NECK MEASUREMENTS - Fit-based ease + seam
    frontNeckWidth: frontNeckWidthCalc,
    frontNeckDepth: frontNeckDepthCalc,
    backNeckDepth: backNeckDepthCalc,  // Derived from front (÷3) or minimum 1.5"

    // SLEEVE & ARMHOLE - Fit-based ease + seam (Cap Height auto-adjusted)
    capHeight: capHeightFinal,
    capHeightCalculated: capHeightCalculated,  // Show original calculation for reference
    capHeightAdjusted: capHeightCalculated !== capHeightFinal,  // Flag if auto-adjusted
    armhole: (armCircumference / 2) + easeConfig.armhole + seam,
    sleeveLength: sleeveLengthFinal,
    sleeveLengthBase: sleeveLengthCalc,  // Show base calculation for reference
    sleeveLengthAllowanceAdded: sleeveLengthFinal !== sleeveLengthCalc,  // Flag if 1" allowance was added

    // ARM CIRCUMFERENCE MEASUREMENTS - Fit-based ease + seam
    bicep: baseBicep + easeConfig.armhole + seam,
    elbow: baseElbow + (easeConfig.armhole * 0.75) + seam,
    wrist: baseWrist + (easeConfig.armhole * 0.5) + seam,
    cuffWidth: baseCuff + easeConfig.armhole + seam,

    // T-SHIRT WAIST & HIPS - Calculate base with ease + seam, then divide by 4 for pattern
    waistBase: studioData.waist ? parseFloat(studioData.waist) + easeConfig.chest + seam : 0,
    waist: studioData.waist ? (parseFloat(studioData.waist) + easeConfig.chest + seam) / 4 : 0,
    hipBase: studioData.hips ? parseFloat(studioData.hips) + (easeConfig.chest * 0.75) + seam : 0,
    hip: studioData.hips ? (parseFloat(studioData.hips) + (easeConfig.chest * 0.75) + seam) / 4 : 0,

    // T-SHIRT FULL LENGTH - Add 1" for ease and sewing allowance
    tshirtFullLength: fullLengthFinal,
    tshirtFullLengthBase: studioData.tshirtLength ? parseFloat(studioData.tshirtLength) : 0,

    // HEM & SIDE SEAM - Fit-based ease + seam
    hemWidth: (studioData.chest - 2) + easeConfig.chest + seam,
    sideSeamLength: studioData.sleeve + (easeConfig.shoulder * 0.5) + seam,

    // PANTS MEASUREMENTS - Fit-based ease + seam
    pantWaist: studioData.waist + easeConfig.pants + seam,
    pantHip: studioData.hips + (easeConfig.pants * 0.5) + seam,
    frontRise: (studioData.waist / 2.5) + (easeConfig.pants * 0.25) + seam,
    backRise: (studioData.waist / 2.2) + (easeConfig.pants * 0.25) + seam,
    thigh: (studioData.hips * 0.35 + 1) + (easeConfig.pants * 0.5) + seam,
    knee: (studioData.hips * 0.25) + (easeConfig.pants * 0.25) + seam,
    ankle: (studioData.hips * 0.18) + (easeConfig.pants * 0.1) + seam,
    inseam: studioData.inseam + seam
  };
}

          ${studioData.sleeveType === 'long' ? `

            ${renderMeasurementRow('Bicep', calc.bicep, u)}
            ${renderMeasurementRow('Elbow', calc.elbow, u)}
            ${renderMeasurementRow('Wrist', calc.wrist, u)}
            ${renderMeasurementRow('Cuff Width', calc.cuffWidth, u)}
          ` : ''}

          <div style="font-weight: 600; color: var(--green); margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.95rem;">Garment Length</div>
          ${studioData.tshirtLength ? renderMeasurementRow('T-Shirt Full Length', calc.tshirtFullLength, u) : '<div style="color: var(--gray); font-size: 0.85rem; padding: 0.5rem 0;">T-Shirt Full Length: Not specified</div>'}

  if(studioData.garmentType !== 'tops') {

        <h4 style="margin-bottom: 1rem; font-size: 1rem; font-weight: 700; color: var(--green);">👖 Pants / Bottoms (Pattern-Ready)</h4>

function renderMeasurementRow(label, value, unit) {
  const formatted = formatMeasurement(value, studioData.unit);
  return `<div style="display: flex; justify-content: space-between;"><span>${label}:</span> <strong>${formatted}</strong></div>`;
}

  }

  // Create customer profile object
  const customerProfile = {
    id: Date.now().toString(),
    name: studioData.customerName,
    gender: studioData.gender,
    age: studioData.age,
    height: studioData.height,
    weight: studioData.weight,
    unit: studioData.unit,
    // Body measurements
    chest: studioData.chest,
    waist: studioData.waist,
    hips: studioData.hips,
    shoulder: studioData.shoulder,
    neckCirc: studioData.neckCirc,
    sleeve: studioData.sleeve,
    tshirtLength: studioData.tshirtLength,
    inseam: studioData.inseam,
    // Sleeve-specific measurements
    bicepCirc: studioData.bicepCirc,
    bicepLength: studioData.bicepLength,
    wristCirc: studioData.wristCirc,
    wristLength: studioData.wristLength,
    elbowCirc: studioData.elbowCirc,
    elbowLength: studioData.elbowLength,
    // Garment & fit
    garmentType: studioData.garmentType,
    sleeveType: studioData.sleeveType,
    fitStyle: studioData.fitStyle,
    fabricType: studioData.fabricType,
    seamAllowance: studioData.seamAllowance,
    // Calculated measurements
    calculated: studioData.calculated,
    // Metadata
    savedDate: new Date().toISOString(),
    tailorName: currentUser.name
  };

  // Check if updating existing profile or creating new one
  if(studioData.profileIndex !== undefined) {
    customerProfiles[studioData.profileIndex] = customerProfile;
    delete studioData.profileIndex;
    alert(`✓ Profile updated for ${studioData.customerName}`);
  } else {
    customerProfiles.push(customerProfile);
    alert(`✓ New customer profile saved for ${studioData.customerName}!`);
  }

  saveCustomerProfiles();

  // Reset studio data for next customer
  setTimeout(() => {
    studioStep = 1;
    studioData = {
      customerName: '',
      gender: 'male',
      age: 30,
      height: 70,
      weight: 180,
      unit: 'inches',
      chest: '',
      waist: '',
      hips: '',
      shoulder: '',
      neckCirc: '',
      sleeve: '',
      tshirtLength: '',
      inseam: '',
      bicepCirc: '',
      bicepLength: '',
      wristCirc: '',
      wristLength: '',
      elbowCirc: '',
      elbowLength: '',
      garmentType: 'tops',
      sleeveType: 'long',
      fitStyle: 'regular',
      fabricType: 'non-stretch',
      seamAllowance: true,
      calculated: {},
      overrides: {}
    };
    renderMeasurementStudio();
  }, 1500);
}
